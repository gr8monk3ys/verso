# One-box Verso. Copy ops/verso.env.example to verso.env, fill it in, then:
#   docker compose up -d --build
# Put TLS in front (Caddy/Traefik/whatever already terminates for the host) —
# preflight refuses a non-https VERSO_BASE_URL for good reason.
services:
  verso:
    build: .
    restart: unless-stopped
    env_file: verso.env
    ports:
      - "3000:3000"
    volumes:
      - verso-data:/var/lib/verso

volumes:
  verso-data:
