name: CI

# ---------------------------------------------------------------------------
# Re-enabled 2026-08-04. The runner/billing condition that killed runs on
# PR #1 (created, failed ~3s later, zero steps executed) cleared with the
# monthly Actions quota; a workflow_dispatch diagnostic ran green end to end.
# If PRs ever show that instant-failure pattern again, it is the quota, not
# the workflow — see the fleet notes in ~/code/CLAUDE.md.
#
# `npm run verify` locally is the same sequence and remains what a release is
# cut from; this exists so the merge gate has a check that runs on PRs.
# ---------------------------------------------------------------------------
on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 — Vercel's default. The database is libsql (a native addon,
          # no experimental flag), so the floor is really just "modern LTS".
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # The §13 guardrail: catalogue match accuracy below 95% means stop
      # feature work. `npm run metrics` exits non-zero when it fails, which is
      # the only reason it counts as a guardrail rather than a chart.
      #
      # It reads data/eval/reconciliation.json — the reconciler graded against the
      # Q-numbers the Met publishes for each object. That artifact is committed, so
      # this needs no network, and a missing artifact fails rather than passing
      # quietly. Refresh it deliberately with `npm run eval:catalogue` (hits WDQS).
      - name: Metric gates
        run: |
          npm run db:reset
          npm run db:seed
          npm run db:demo
          npm run metrics

      # Regrade the committed evaluation from its cached candidate responses, so a
      # scorer or threshold change that moves the guardrail cannot land unnoticed.
      - name: Catalogue accuracy (replay, no network)
        run: npm run eval:catalogue:replay
